            AccessibleLabel: |-
              ="Local authority area filter"
            OnChange: |-
              =Set(varFLAA, Self.Selected.Name);
              Select(btnApplyFilters)

      - lblCapDelivery:
          Control: Label
          Properties:
            X: =956
            Y: =60
            Width: =170
            Height: =16
            Text: |-
              ="Delivery area"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddDelivery:
          Control: ModernDropdown
          Properties:
            X: =956
            Y: =78
            Width: =170
            Height: =32
            Items: =Sort('SEL Delivery Areas', Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
