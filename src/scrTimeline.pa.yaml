                  X: =476
                  Y: =434
                  Width: =400
                  Height: =16
                  Text: |-
                    ="* Engagement Method"
                  Size: =9
                  Color: =ClrMuted
            - ddFrmMethod:
                Control: Classic/DropDown
                Properties:
                  Font: =BrandFont
                  X: =476
                  Y: =452
                  Width: =400
                  Height: =34
                  Items: =Choices('SEL Engagement Activities'.'Engagement Method')
                  AllowEmptySelection: =true
                  Reset: =varAddReset

            - lblFldPhase:
                Control: Label
                Properties:
                  Font: =BrandFont
                  X: =476
                  Y: =494
                  Width: =400
                  Height: =16
                  Text: |-
                    ="Engagement Phase"
                  Size: =9
                  Color: =ClrMuted
            - ddFrmPhase:
                Control: Classic/DropDown
                Properties:
                  Font: =BrandFont
                  X: =476
                  Y: =512
                  Width: =400
                  Height: =34
                  Items: =Choices('SEL Engagement Activities'.'Engagement Phase')
                  AllowEmptySelection: =true
                  Reset: =varAddReset

            # Date TBC marks an unconfirmed date. Marker colour comes from
            # Engagement Method; a TBC marker is drawn as a hollow diamond
            # instead of a filled one.
            - lblFldDateTBC:
                Control: Label
                Properties:
                  Font: =BrandFont
                  X: =476
                  Y: =554
                  Width: =400
                  Height: =16
                  Text: |-
                    ="Date confidence"
                  Size: =9
                  Color: =ClrMuted
            - chkDateTBC:
                Control: Classic/CheckBox
                Properties:
                  Font: =BrandFont
                  X: =476
                  Y: =572
                  Width: =400
                  Height: =34
                  Text: |-
                    ="Date is not yet confirmed (TBC)"
                  Size: =10
                  Default: =false
                  Reset: =varAddReset

            # ═════════════════ VALIDATION AND BUTTONS ═════════════════

            - lblValidation:
                Control: Label
                Properties:
                  Font: =BrandFont
                  X: =24
                  Y: =620
                  Width: =580
                  Height: =36
                  Text: |-
                    =If(
                        dpEnd.SelectedDate < dpStart.SelectedDate,
                        "End Date cannot be earlier than Start Date",
                        ""
                     )
                  Color: =ClrRed
                  Size: =10
                  VerticalAlign: =VerticalAlign.Middle

            - btnModalClose:
                Control: Classic/Button
                Properties:
                  Font: =BrandFont
                  X: =620
                  Y: =620
                  Width: =110
                  Height: =36
                  Text: |-
                    ="Close"
                  Fill: =RGBA(255, 255, 255, 1)
                  Color: =ClrText
                  BorderColor: =ClrBorder
                  BorderThickness: =1
                  OnSelect: =Set(varShowAdd, false); Set(varAddReset, true)

            - btnSubmit:
                Control: Classic/Button
                Properties:
                  Font: =BrandFont
                  X: =746
                  Y: =620
                  Width: =130
                  Height: =36
                  Text: |-
                    ="Submit"
                  Fill: =ClrHeader
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledFill: =ClrDisabled
                  DisabledColor: =RGBA(255, 255, 255, 1)
                  # enabled only when every required field is filled
                  DisplayMode: |-
                    =If(
                        !IsBlank(txtActivity.Text)
                        && !IsBlank(ddFrmProject.Selected.Value)
                        && !IsBlank(ddFrmSite.Selected.Value)
                        && !IsBlank(ddFrmCategory.Selected.Value)
                        && !IsBlank(txtStakeholderName.Text)
                        && !IsBlank(ddFrmLAA.Selected.Value)
                        && !IsBlank(ddFrmDelivery.Selected.Value)
                        && !IsBlank(cmbLead.Selected.'Full Name')
                        && !IsBlank(dpStart.SelectedDate)
                        && !IsBlank(dpEnd.SelectedDate)
                        && !IsBlank(ddFrmMethod.Selected.Value)
                        && dpEnd.SelectedDate >= dpStart.SelectedDate,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                     )
                  OnSelect: |-
                    =Patch(
                        'SEL Engagement Activities',
                        Defaults('SEL Engagement Activities'),
                        {
                            Activity:               txtActivity.Text,
                            Project:                LookUp('SEL Projects', Name = ddFrmProject.Selected.Value),
                            Programme:              LookUp('SEL Programmes', Name = ddFrmProgramme.Selected.Value),
                            'Project Site':         LookUp('SEL Project Sites', Name = ddFrmSite.Selected.Value),
                            'Stakeholder Category': LookUp('SEL Stakeholder Categories', Name = ddFrmCategory.Selected.Value),
                            'Stakeholder Name':     txtStakeholderName.Text,
                            'Stakeholder Group':    txtStakeholderGroup.Text,
                            'Local Authority Area': LookUp('SEL Local Authority Areas', Name = ddFrmLAA.Selected.Value),
                            'Delivery Area':        LookUp('SEL Delivery Areas', Name = ddFrmDelivery.Selected.Value),
                            'Engagement Lead':      cmbLead.Selected,
                            'Engagement Manager':   txtEngManager.Text,
                            'Start Date':           dpStart.SelectedDate,
                            'End Date':             dpEnd.SelectedDate,
                            'Engagement Level':     ddFrmLevel.Selected.Value,
                            'Engagement Method':    ddFrmMethod.Selected.Value,
                            'Engagement Phase':     ddFrmPhase.Selected.Value,
                            RAG:                    ddFrmRAG.Selected.Value,
                            'Date TBC':             chkDateTBC.Value
                        }
                     );
                     If(
                        IsEmpty(Errors('SEL Engagement Activities')),
                        Notify("Activity added", NotificationType.Success);
                        Set(varShowAdd, false);
                        Set(varAddReset, true);
                        Select(btnLoadWindow),
                        Notify(
                            First(Errors('SEL Engagement Activities')).Message,
                            NotificationType.Error
                        )
                     )
