              Select(btnApplyFilters)

      - btnClearFilters:
          Control: Classic/Button
          Properties:
            X: =16
            Y: =120
            Width: =130
            Height: =30
            Text: |-
              ="Clear filters"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =ClrText
            BorderColor: =ClrBorder
            BorderThickness: =1
            Size: =TypeLabel
            Font: =BrandFont
            #  Clearing the variables is enough: every dropdown Default reads
            #  them, so all six bars follow without a Reset() on each control.
            OnSelect: |-
              =Set(varFProgramme, "");
              Set(varFProject, "");
              Set(varFStakeholder, "");
              Set(varFSite, "");
              Set(varFLAA, "");
              Set(varFDelivery, "");
              Select(btnApplyFilters)
      - btnAddActivity:
          Control: Classic/Button
          Properties:
            Font: =BrandFont
            X: =1136
            Y: =78
            Width: =214
            Height: =32
            Text: |-
              ="+  Add New Activity"
            Fill: =ClrAccent
            Color: =RGBA(255, 255, 255, 1)
            Size: =11
            OnSelect: |-
              =Set(varNewDate, Today());
              Set(varAddReset, false);
              Set(varShowAdd, true)

      - chkLimitHeight:
          Control: Classic/CheckBox
          Properties:
            Font: =BrandFont
            X: =156
            Y: =120
            Width: =180
            Height: =30
            Text: |-
              ="Limit Area Height"
            Size: =10
            Default: =false
            # Classic/CheckBox has no OnChange: it exposes OnCheck and OnUncheck.
            OnCheck: =Select(btnApplyFilters)
            OnUncheck: =Select(btnApplyFilters)

      - chkHideEmpty:
          Control: Classic/CheckBox
          Properties:
            Font: =BrandFont
            X: =346
            Y: =120
            Width: =190
            Height: =30
            Text: |-
              ="Hide Empty Area's"
            Size: =10
            Default: =true
            # Classic/CheckBox has no OnChange: it exposes OnCheck and OnUncheck.
            OnCheck: =Select(btnApplyFilters)
            OnUncheck: =Select(btnApplyFilters)

      # Record counter plus a truncation indicator.
      # Without it a truncated result just looks like "there is no data".
      - lblCount:
          Control: Label
          Properties:
            Font: =BrandFont
            X: =546
            Y: =120
            Width: =456
            Height: =30
            Text: |-
              =CountRows(colVisible) & " of " & CountRows(colWindow) & "  ·  " &
               Text(TimelineStart, "mmm") & " – " &
               Text(DateAdd(TimelineEnd, -1, TimeUnit.Days), "mmm yyyy") &
               If(
                   WindowServerCount > CountRows(colWindow),
                   "   ⚠ loaded " & CountRows(colWindow) & " of " &
                   WindowServerCount & " — result truncated",
                   ""
               ) &
               If(
                   varNoCategory > 0,
