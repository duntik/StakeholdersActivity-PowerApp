#  scrTimeline — the Gantt-style lookahead board.
#
#  A three-month window with one row per stakeholder category and one lane per
#  activity: diamonds for single-day activities, bars for multi-day ones, a
#  hollow diamond when the date is TBC. Also hosts the Add New Activity form
#  used by scrList and scrCalendar.
#
#  Two hidden 1x1 buttons at the origin, first in Children so the header paints
#  over them, carry all the logic:
#    btnLoadWindow   — the only server query, builds colWindow and colCategories
#    btnApplyFilters — derives colVisible / colRows / the print collections
#  They are controls and not named formulas because a named formula does not
#  receive a collection's schema. See App.Formulas.txt for the full rule.
#
#  HOW TO PASTE
#    1. Paste App.Formulas.txt into App > Formulas first (once for the whole app).
#    2. New screen → Blank, rename it scrTimeline, select it in the tree, Ctrl+V.
#
#  One screen per file, which is the shape Microsoft's YAML schema expects:
#  a single top-level object per .pa.yaml.
#
#  App-wide rules that bite when editing any of these files:
#    - Every property value starts with "="; multi-line formulas use "|-".
#    - A plain scalar may not contain ": " — record literals go in a |- block.
#    - Order within Children is the z-order: the last element is the topmost.
#    - AccessibleLabel does not exist on Classic/Button.
#    - Classic dropdowns (in the add form) take one-column tables built from
#      record literals, because the display-column property is not applied on
#      paste. Selected is therefore Selected.Value, and the full row is re-read
#      with LookUp where needed.
#

Screens:
  scrTimeline:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      OnVisible: |-
        =If(
            IsEmpty(colWindow) || Coalesce(varMonthOffset, 0) <> Coalesce(varLoadedOffset, -9999),
            Select(btnLoadWindow)
         )
    Children:

      # ─────────── DATA LOAD ───────────
      #  This hidden button owns the only server query in the app. It lives in a
      #  control rather than a user-defined function because ClearCollect inside a
      #  UDF does not expose the collection schema to the rest of the app.
      - btnLoadWindow:
          Control: Classic/Button
          Properties:
            Font: =BrandFont
            X: =0
            Y: =0
            Width: =1
            Height: =1
            # Visible stays true: Select() does not fire on a hidden control.
            # Hidden by z-order instead: 1x1 at the origin, first in Children,
            # so the opaque header rectangle paints over it. Negative X/Y does
            # NOT work — Studio normalises it away on paste.
            Text: |-
              ="load"
            OnSelect: |-
              =Set(
                  varWindowStart,
                  DateAdd(Date(Year(Today()), Month(Today()), 1), Coalesce(varMonthOffset, 0), TimeUnit.Months)
              );

              ClearCollect(
                  colWindow,
                  AddColumns(
                      Filter(
                          'SEL Engagement Activities',
                          'Start Date' <  DateAdd(varWindowStart, 3, TimeUnit.Months),
                          'End Date'   >= varWindowStart
                      ),
                      CategoryName,  'Stakeholder Category'.Name,
                      ProgrammeName, Programme.Name,
                      ProjectName,   Project.Name,
                      SiteName,      'Project Site'.Name,
                      LAAName,       'Local Authority Area'.Name,
                      DeliveryName,  'Delivery Area'.Name,
                      StartD,        'Start Date',
                      EndD,          'End Date',
                      DayOffset,     DateDiff(varWindowStart, 'Start Date', TimeUnit.Days),
                      BarDays,       Max(DateDiff('Start Date', 'End Date', TimeUnit.Days), 1),
                      IsDiamond,     'End Date' = 'Start Date',
                      CatSort,       'Stakeholder Category'.'Sort Order',
                      CatActive,     'Stakeholder Category'.Active,
                      DateTBC,       'Date TBC',
                      IsRecent,      'Modified On' > DateAdd(Now(), -7, TimeUnit.Days),
                      CreatedOn,     'Created On',
                      MarkerHex,     If('Engagement Method' = 'SEL Engagement Methods'.'Public Event',
                                       HexEvent, HexMeeting),
                      LabelText,     Text('Start Date', "dd mmm") &
                                       If('End Date' = 'Start Date',
                                          "",
                                          " – " & Text('End Date', "dd mmm")) &
                                       " – " &
                                       If(Project.Name = "N/A", "", Project.Name & ": ") & Activity,
                      TipText,       Activity & Char(10) &
                                       "Project: "     & Project.Name & Char(10) &
                                       "Site: "        & 'Project Site'.Name & Char(10) &
                                       "Stakeholder: " & 'Stakeholder Name' & Char(10) &
                                       "Dates: "       & Text('Start Date', "dd mmm yyyy") & " – " &
                                                         Text('End Date',   "dd mmm yyyy") & Char(10) &
                                       "RAG: "         & Switch(
                                                             'RAG',
                                                             'SEL RAG Values'.Red,   "Red",
                                                             'SEL RAG Values'.Amber, "Amber",
                                                             'SEL RAG Values'.Green, "Green",
                                                             "—"
                                                         )
                  )
              );

              // Reference data, fetched once per window load rather than in
              // btnApplyFilters, so changing a filter or checkbox stays local.
              ClearCollect(
                  colCategories,
                  Sort(Filter('SEL Stakeholder Categories', Active = true), 'Sort Order')
              );

              Set(varLoadedOffset, Coalesce(varMonthOffset, 0));
              Select(btnApplyFilters)

      # Derived collections. Separate from btnLoadWindow so that changing a
      # filter re-derives without another server round trip.
      - btnApplyFilters:
          Control: Classic/Button
          Properties:
            Font: =BrandFont
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Text: |-
              ="apply"
            OnSelect: |-
              =ClearCollect(
                  colFiltered,
                  AddColumns(
                      Filter(
                          colWindow,
                          IsBlank(varFProgramme)   || ProgrammeName = varFProgramme,
                          IsBlank(varFProject)     || ProjectName   = varFProject,
                          IsBlank(varFStakeholder) || CategoryName  = varFStakeholder,
                          IsBlank(varFSite)        || SiteName      = varFSite,
                          IsBlank(varFLAA)         || LAAName       = varFLAA,
                          IsBlank(varFDelivery)    || DeliveryName  = varFDelivery
                      ) As F,
                      // The row a marker belongs to. A record with no category, or one
                      // whose category was deactivated, lands in its own visible row
                      // rather than being filtered away.
                      RowName,
                      If(Coalesce(F.CatActive, false), F.CategoryName, "— Uncategorised —")
                  )
              );

              // Seq is the marker's index within its row. Every marker gets its own lane
              // in date order — no interval packing — so lane and Seq are the same
              // number. The comparator (StartD, then CreatedOn) matches the
              // gallery Items sort, so Seq equals the real layout position.
              // LabelOnLeft flips the label to the left of the marker near the right edge.
              ClearCollect(
                  colVisible,
                  AddColumns(
                      colFiltered As A,
                      Seq,
                      CountRows(
                          Filter(
                              colFiltered,
                              RowName = A.RowName,
                              StartD < A.StartD || (StartD = A.StartD && CreatedOn < A.CreatedOn)
                          )
                      ),
                      LabelOnLeft,
                      Max(A.DayOffset, 0) * PxPerDay +
                          If(A.IsDiamond, 0, A.BarDays * PxPerDay) + 250 > PlotW,
                      // The row fill comes from data, so the label colour must too —
                      // a dark category colour would make ClrText labels unreadable.
                      RowTextColour,
                      Coalesce(LookUp(colCategories, Name = A.RowName, 'Text Colour Hex'), "#20304A")
                  )
              );

              // Timeline rows: categories with their marker count.
              // Hide Empty Area's drops rows where Cnt = 0.
              // RowRank is the row's position in the list; Top, computed below, is the
              // running sum of the heights above it, which is what the print screen needs.
              ClearCollect(
                  colRowsRaw,
                  Filter(
                      ForAll(
                          colCategories As C,
                          With(
                              { m: Filter(colVisible, RowName = C.Name) },
                              {
                                  Name:       C.Name,
                                  Colour:     C.'Colour Hex',
                                  TextColour: C.'Text Colour Hex',
                                  SortOrder:  C.'Sort Order',
                                  Cnt:        CountRows(m),
                                  Lanes:      CountRows(m)
                              }
                          )
                      ),
                      !chkHideEmpty.Value || Cnt > 0
                  )
              );

              // Uncategorised is not a category in Dataverse, so its row is built here.
              // Sort order 99999 keeps it at the bottom, below every real category.
              If(
                  CountRows(Filter(colVisible, RowName = "— Uncategorised —")) > 0,
                  Collect(
                      colRowsRaw,
                      {
                          Name:       "— Uncategorised —",
                          Colour:     "#F7DCDD",
                          TextColour: "#7E171C",
                          SortOrder:  99999,
                          Cnt:        CountRows(Filter(colVisible, RowName = "— Uncategorised —")),
                          Lanes:      CountRows(Filter(colVisible, RowName = "— Uncategorised —"))
                      }
                  )
              );

              // Per-row height. Limit Area Height caps every row at three lanes;
              // otherwise a row is exactly as tall as its own marker count needs.
              ClearCollect(
                  colRowsH,
                  AddColumns(
                      colRowsRaw As R,
                      H,
                      If(
                          chkLimitHeight.Value,
                          Max(RowMinH, 3 * LaneH + 14),
                          Max(RowMinH, R.Cnt * LaneH + 14)
                      )
                  )
              );

              // Top is a running sum of the heights above, not rank * height,
              // because rows differ in height.
              // Coalesce because Sum over an empty table is blank, and the first
              // row has no predecessors — blank + number would poison every
              // marker on the print screen.
              ClearCollect(
                  colRows,
                  AddColumns(
                      colRowsH As R,
                      RowRank,
                      CountRows(Filter(colRowsH, SortOrder < R.SortOrder)),
                      Top,
                      Coalesce(Sum(Filter(colRowsH, SortOrder < R.SortOrder), H), 0)
                  )
              );

              // ═══════════ Row height ═══════════
              // Heights live in colRowsH above. galRows is a VariableHeight gallery, so
              // each row is as tall as its own children — TemplateSize never has to know
              // about ThisItem.
              // varNoCategory counts records whose Stakeholder Category is blank or
              // deactivated; they appear in the Uncategorised row and the counter
              // reports them separately.
              Set(varNoCategory, CountRows(Filter(colVisible, RowName = "— Uncategorised —")));

              // A row is clipped when its lanes need more than its height allows,
              // which only happens when Limit Area Height is on.
              Set(varRowsClipped, CountRows(Filter(colRows, Cnt * LaneH + 14 > H)) > 0);
              Set(varPrintTotalH, Coalesce(Sum(colRows, H), 0));

              // ═══════════ Flat layout for the print screen ═══════════
              // On scrTimeline the vertical position comes from a nested gallery. PDF export
              // does not support nested galleries, so there Y is absolute: each row's top
              // is the running sum (Top) computed in colRows.
              ClearCollect(
                  colPrintRows,
                  ForAll(
                      colRows As R,
                      {
                          Name: R.Name, Colour: R.Colour, TextColour: R.TextColour,
                          Cnt: R.Cnt, H: R.H,
                          Top: R.Top
                      }
                  )
              );

              // Markers with absolute Y. SeqAll is the running index across the whole table
              // (not within a category, as Seq is), because on the print screen this is one
              // flat gallery. Same comparator as the gallery Items sort: CatSort, StartD,
              // CreatedOn.
              ClearCollect(
                  colPrintMarkers,
                  ForAll(
                      colVisible As M,
                      {
                          Activity: M.Activity, CategoryName: M.RowName,
                          CatSort: M.CatSort, CreatedOn: M.CreatedOn,
                          StartD: M.StartD, DayOffset: M.DayOffset, BarDays: M.BarDays,
                          IsDiamond: M.IsDiamond, MarkerHex: M.MarkerHex,
                          LabelText: M.LabelText, TipText: M.TipText,
                          Seq: M.Seq, LabelOnLeft: M.LabelOnLeft,
                          RowTextColour: M.RowTextColour,
                          DateTBC: M.DateTBC, IsRecent: M.IsRecent,
                          // Coalesce rather than a bare LookUp: if the category is deactivated
                          // there is no row for it, LookUp returns blank, and blank + number =
                          // number — the marker would silently land on top of the very first
                          // category. -9999 pushes it off-canvas, where it reads as missing
                          // rather than as belonging to the wrong row.
                          Top: Coalesce(LookUp(colPrintRows, Name = M.RowName, Top), -9999),
                          SeqAll: CountRows(
                              Filter(
                                  colVisible,
                                  CatSort < M.CatSort ||
                                  (CatSort = M.CatSort &&
                                      (StartD < M.StartD ||
                                       (StartD = M.StartD && CreatedOn < M.CreatedOn)))
                              )
                          )
                      }
                  )
              )


      # ══════════════════ SHARED HEADER ══════════════════
      #  Repeated per screen because the modern Header control is documented
      #  as not replicating across screens, and a canvas component would need
      #  a library import that YAML paste cannot perform.
      - recHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =1366
            Height: =56
            Fill: =ClrHeader

      - lblTitle:
          Control: Label
          Properties:
            X: =20
            Y: =0
            Width: =600
            Height: =56
            Text: |-
              ="Stakeholder Engagement Lookahead"
            Color: =ClrOnDark
            Size: =TypeHeadline
            FontWeight: =FontWeight.Semibold
            Font: =BrandFont
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            Role: =TextRole.Heading1

      - lblBrand:
          Control: Label
          Properties:
            X: =640
            Y: =0
            Width: =320
            Height: =56
            Text: =BrandName
            Color: =ClrOnDark
            Size: =TypeTitleLg
            FontWeight: =FontWeight.Bold
            Font: =BrandFont
            Align: =Align.Right
            VerticalAlign: =VerticalAlign.Middle
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            #  PLACEHOLDER. Replace this Label with an Image of your logo; a
            #  white version reads best on the dark header.

      - btnNavTimeline:
          Control: Classic/Button
          Properties:
            X: =982
            Y: =12
            Width: =100
            Height: =32
            Text: |-
              ="Timeline"
            Fill: =MdPrimaryContainer
            Color: =MdOnPrimaryContainer
            BorderColor: =ClrOnDark
            BorderThickness: =0
            Size: =TypeLabel
            Font: =BrandFont
            DisplayMode: =DisplayMode.Disabled
            DisabledFill: =MdPrimaryContainer
            DisabledColor: =MdOnPrimaryContainer

      - btnNavCalendar:
          Control: Classic/Button
          Properties:
            X: =1090
            Y: =12
            Width: =100
            Height: =32
            Text: |-
              ="Calendar"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =ClrText
            BorderColor: =ClrOnDark
            BorderThickness: =1
            Size: =TypeLabel
            Font: =BrandFont
            OnSelect: =Navigate(scrCalendar, ScreenTransition.None)
            HoverFill: =MdPrimaryContainer
            HoverColor: =MdOnPrimaryContainer

      - btnNavList:
          Control: Classic/Button
          Properties:
            X: =1198
            Y: =12
            Width: =100
            Height: =32
            Text: |-
              ="List"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =ClrText
            BorderColor: =ClrOnDark
            BorderThickness: =1
            Size: =TypeLabel
            Font: =BrandFont
            OnSelect: =Navigate(scrList, ScreenTransition.None)
            HoverFill: =MdPrimaryContainer
            HoverColor: =MdOnPrimaryContainer

      - icoSettings:
          Control: Classic/Icon
          Properties:
            Icon: =Icon.Settings
            X: =1310
            Y: =14
            Width: =28
            Height: =28
            Color: =ClrOnDark
            Tooltip: |-
              ="Reference data"
            AccessibleLabel: |-
              ="Reference data settings"
            OnSelect: =Navigate(scrRefData, ScreenTransition.None)
      # ══════════════════ SHARED FILTER BAR ══════════════════
      #  Identical on scrList, scrTimeline and scrCalendar. Keep the three
      #  copies in sync when changing one.
      #
      #  The selection lives in GLOBAL VARIABLES, not in the controls. Reading
      #  a control means the filter only exists on the screen that owns it —
      #  navigate away and the same bar elsewhere would show something else.
      #
      #  ModernDropdown carries ItemDisplayText, which is the documented way to
      #  choose the displayed column, so no one-column ForAll table is needed
      #  as with a classic dropdown. Note it is an EXPRESSION: ="Name" as a
      #  string compiles and renders every option blank.
      - recFilterBar:
          Control: Rectangle
          Properties:
            X: =0
            Y: =56
            Width: =1366
            Height: =100
            Fill: =ClrFilterBg

      - lblCapProgramme:
          Control: Label
          Properties:
            X: =16
            Y: =60
            Width: =170
            Height: =16
            Text: |-
              ="Programme"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddProgramme:
          Control: ModernDropdown
          Properties:
            X: =16
            Y: =78
            Width: =170
            Height: =32
            Items: =Sort('SEL Programmes', Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
            #  shared variable is what keeps the bar in step across screens.
            Default: |-
              =LookUp(Sort('SEL Programmes', Name), Name = varFProgramme)
            AccessibleLabel: |-
              ="Programme filter"
            OnChange: |-
              =Set(varFProgramme, Self.Selected.Name);
              Select(btnApplyFilters)

      - lblCapProject:
          Control: Label
          Properties:
            X: =194
            Y: =60
            Width: =170
            Height: =16
            Text: |-
              ="Project"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddProject:
          Control: ModernDropdown
          Properties:
            X: =194
            Y: =78
            Width: =170
            Height: =32
            Items: =Sort(Filter('SEL Projects', Active = true), Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
            #  shared variable is what keeps the bar in step across screens.
            Default: |-
              =LookUp(Sort(Filter('SEL Projects', Active = true), Name), Name = varFProject)
            AccessibleLabel: |-
              ="Project filter"
            OnChange: |-
              =Set(varFProject, Self.Selected.Name);
              Select(btnApplyFilters)

      - lblCapStakeholder:
          Control: Label
          Properties:
            X: =372
            Y: =60
            Width: =190
            Height: =16
            Text: |-
              ="Stakeholder category"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddStakeholder:
          Control: ModernDropdown
          Properties:
            X: =372
            Y: =78
            Width: =190
            Height: =32
            Items: =Sort(Filter('SEL Stakeholder Categories', Active = true), Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
            #  shared variable is what keeps the bar in step across screens.
            Default: |-
              =LookUp(Sort(Filter('SEL Stakeholder Categories', Active = true), Name), Name = varFStakeholder)
            AccessibleLabel: |-
              ="Stakeholder category filter"
            OnChange: |-
              =Set(varFStakeholder, Self.Selected.Name);
              Select(btnApplyFilters)

      - lblCapSite:
          Control: Label
          Properties:
            X: =570
            Y: =60
            Width: =170
            Height: =16
            Text: |-
              ="Site"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddSite:
          Control: ModernDropdown
          Properties:
            X: =570
            Y: =78
            Width: =170
            Height: =32
            Items: =Sort('SEL Project Sites', Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
            #  shared variable is what keeps the bar in step across screens.
            Default: |-
              =LookUp(Sort('SEL Project Sites', Name), Name = varFSite)
            AccessibleLabel: |-
              ="Site filter"
            OnChange: |-
              =Set(varFSite, Self.Selected.Name);
              Select(btnApplyFilters)

      - lblCapLAA:
          Control: Label
          Properties:
            X: =748
            Y: =60
            Width: =200
            Height: =16
            Text: |-
              ="Local authority area"
            Size: =TypeLabel
            Color: =ClrMuted
            Font: =BrandFont
            Wrap: =false
            PaddingTop: =0
            PaddingBottom: =0
            PaddingLeft: =0

      - ddLAA:
          Control: ModernDropdown
          Properties:
            X: =748
            Y: =78
            Width: =200
            Height: =32
            Items: =Sort('SEL Local Authority Areas', Name)
            ItemDisplayText: =ThisItem.Name
            #  Default is a RECORD, matching Selected. Looking it up from the
