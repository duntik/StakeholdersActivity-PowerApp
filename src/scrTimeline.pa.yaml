      # ───────────────────────── TIMELINE ─────────────────────────
      #  Bottom layer: gallery of category rows (row height from lane count).
      #  Top layer: nested marker gallery with TemplateSize = LaneH.
      #
      #  The marker gallery lays itself out: TemplateSize = LaneH gives every
      #  marker its own 24px lane, in the order Items delivers them. Children
      #  therefore position only horizontally; their Y is a constant offset
      #  inside the lane.
      #
      #  Do not use TemplateSize = 1 with a Seq * (LaneH - 1) offset term instead.
      #  That only works if the gallery advances item k by exactly TemplateSize,
      #  and it does not: when TemplateSize is smaller than the template content,
      #  the platform raises the rendered row height, the offset stops matching
      #  and the markers pile up in a narrow band.
      - galRows:
          Control: Gallery
          # VariableHeight, not Vertical: rows size themselves to their content,
          # which TemplateSize alone cannot express, since it may not read ThisItem.
          Variant: VariableHeight
          Properties:
            X: =PlotX - LabelW
            Y: =TopY
            Width: =LabelW + PlotW
            Height: =PlotH
            TemplatePadding: =0
            ShowScrollbar: =true
            ShowNavigation: =false
            # On: forcing every row to build its nested marker gallery in one
            # frame is what the platform warns about.
            DelayItemLoading: =true
            Selectable: =false
            AccessibleLabel: |-
              ="Stakeholder engagement timeline by category"
            ItemAccessibleLabel: |-
              =ThisItem.Name & ": " & ThisItem.Cnt & " activities"
            # The floor only. Actual height comes from the children, each of
            # which reads ThisItem.H.
            TemplateSize: =RowMinH
            Items: =colRows
          Children:
            - recRowBg:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =ThisItem.H
                  Fill: |-
                    =ColorValue(Coalesce(ThisItem.Colour, "#E9EDF2"))

            - lblRowName:
                Control: Label
                Properties:
                  Font: =BrandFont
                  X: =8
                  Y: =0
                  Width: =LabelW - 16
                  Height: =ThisItem.H
                  Text: |-
                    =ThisItem.Name & "  (" & ThisItem.Cnt & ")"
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  Color: |-
                    =ColorValue(Coalesce(ThisItem.TextColour, "#20304A"))
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =true
                  PaddingLeft: =0

            - recLabelDiv:
                Control: Rectangle
                Properties:
                  X: =LabelW - 1
                  Y: =0
                  Width: =1
                  Height: =ThisItem.H
                  Fill: =ClrGrid

            - recMonthSep1:
                Control: Rectangle
                Properties:
                  X: |-
                    =LabelW + DateDiff(TimelineStart, DateAdd(TimelineStart, 1, TimeUnit.Months), TimeUnit.Days) * PxPerDay
                  Y: =0
                  Width: =1
                  Height: =ThisItem.H
                  Fill: =ClrGrid

            - recMonthSep2:
                Control: Rectangle
                Properties:
                  X: |-
                    =LabelW + DateDiff(TimelineStart, DateAdd(TimelineStart, 2, TimeUnit.Months), TimeUnit.Days) * PxPerDay
                  Y: =0
                  Width: =1
                  Height: =ThisItem.H
                  Fill: =ClrGrid

            - recRowBottom:
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =ThisItem.H - 1
                  Width: =Parent.Width
                  Height: =1
                  Fill: =ClrGrid

            # ── Marker layer ───────────────────────────────────────────
            #  Height is the row height. Markers that need more lanes than the row
            #  has are clipped; varRowsClipped in btnApplyFilters reports it.
            #  Items are sorted by the same comparator that computes Seq.
            - galMarkers:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =LabelW
                  Y: =0
                  Width: =PlotW
                  Height: =ThisItem.H
                  # One lane per marker: the gallery does the vertical layout itself.
                  TemplateSize: =LaneH
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  ShowNavigation: =false
                  DelayItemLoading: =false
                  AccessibleLabel: |-
                    ="Activities for " & ThisItem.Name
                  ItemAccessibleLabel: =ThisItem.TipText
                  Items: |-
                    =SortByColumns(
                        Filter(colVisible, RowName = ThisItem.Name),
                        "StartD", SortOrder.Ascending,
                        "CreatedOn", SortOrder.Ascending
                     )
                Children:
                  # bar — a multi-day activity
                  - recBar:
                      Control: Rectangle
                      Properties:
                        Visible: =!ThisItem.IsDiamond
                        X: =Max(ThisItem.DayOffset, 0) * PxPerDay
                        Y: =11
                        Width: |-
                          =Max(
                              (ThisItem.DayOffset + ThisItem.BarDays) - Max(ThisItem.DayOffset, 0),
                              1
                           ) * PxPerDay
                        Height: =10
                        Fill: =ColorValue(ThisItem.MarkerHex)
                        Tooltip: =ThisItem.TipText
                        OnSelect: =Set(varSelected, ThisItem)

                  # diamond — a single date (SVG: colour from data, crisp edges)
                  - imgDiamond:
                      Control: Image
                      Properties:
                        Visible: =ThisItem.IsDiamond
                        X: =ThisItem.DayOffset * PxPerDay - 8
                        Y: =8
                        Width: =16
                        Height: =16
                        Image: |-
                          ="data:image/svg+xml;utf8," &
                           EncodeUrl(
                               "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>" &
                               "<polygon points='12,1.5 22.5,12 12,22.5 1.5,12' fill='" &
                               If(ThisItem.DateTBC, "none", ThisItem.MarkerHex) &
                               "' stroke='" &
                               If(ThisItem.DateTBC, ThisItem.MarkerHex, "#FFFFFF") &
                               "' stroke-width='" &
                               If(ThisItem.DateTBC, 2.5, 1.2) & "'/></svg>"
                           )
                        Tooltip: =ThisItem.TipText
                        OnSelect: =Set(varSelected, ThisItem)

                  # Label to the right of the marker, except near the right edge of
                  # the window where it goes to the left, otherwise the text runs
                  # outside the plot area.
                  - lblMarker:
                      Control: Label
                      Properties:
                        Font: =BrandFont
                        X: |-
                          =If(
                              ThisItem.LabelOnLeft,
                              Max(ThisItem.DayOffset, 0) * PxPerDay - 246,
                              Max(ThisItem.DayOffset, 0) * PxPerDay +
                              If(
                                  ThisItem.IsDiamond,
                                  11,
                                  Max(
                                      (ThisItem.DayOffset + ThisItem.BarDays) - Max(ThisItem.DayOffset, 0),
                                      1
                                  ) * PxPerDay + 6
                              )
                           )
                        Y: =6
                        Width: =240
                        Height: =20
                        Text: =ThisItem.LabelText
                        FontWeight: |-
                          =If(ThisItem.IsRecent, FontWeight.Semibold, FontWeight.Normal)
                        Size: =9
                        Color: =ColorValue(ThisItem.RowTextColour)
                        Align: |-
                          =If(ThisItem.LabelOnLeft, Align.Right, Align.Left)
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Tooltip: =ThisItem.TipText
                        OnSelect: =Set(varSelected, ThisItem)

